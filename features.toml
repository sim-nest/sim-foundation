schema = "sim.features"

[enforcement.audience]
framework = "strict"
code = "strict"

[enforcement.specimen]
user = "strict"
framework = "strict"
code = "advisory"

[enforcement.route]
major_entrypoints = "advisory"
frameworks = "advisory"

[[feature]]
id = "feature/sim-foundation/web-evidence-core"
title = "Immutable web capture and evidence records"
summary = "Separate raw capture and normalized representation identities, exact Unicode-scalar selectors, and complete fail-closed web policy receipts."
owner = "crate/sim-lib-web-core"
audiences = ["code", "framework"]
guidance = "Reuse these records for provider-independent web evidence. Keep sockets, HTML parsing, provider payloads, ranking, and office evidence outside foundation; a citation must retain an exact selector over an immutable representation."
claims_anchors = ["anchor/crate/sim-lib-web-core"]
claims_specimens = ["recipe/sim-foundation/crates/sim-lib-web-core/01-basics/exact-selector", "spec-test/sim-foundation/crates/sim-lib-web-core/src/tests"]

[[feature]]
id = "feature/sim-foundation/search-evidence-core"
title = "Open search and research records"
summary = "Define queries, sites, provider claims, observations, pages, notices, alias evidence, rank contributions, runs, checked citations, bundles, and a pure wire-codec boundary."
owner = "crate/sim-lib-search-core"
audiences = ["code", "framework"]
guidance = "Compose this vocabulary with web-evidence-core and installed general-purpose codecs. Provider snippets remain ProviderClaim values and cannot construct citations; provider I/O and rank algorithms belong downstream."
claims_anchors = ["anchor/crate/sim-lib-search-core"]
claims_specimens = ["recipe/sim-foundation/crates/sim-lib-search-core/01-basics/checked-citation", "spec-test/sim-foundation/crates/sim-lib-search-core/src/tests"]

[[feature]]
id = "feature/sim-foundation/study-core"
title = "Domain-neutral study records"
summary = "Define canonical subject, coordinate, attempt, outcome, estimate, decision, selection, evidence, and privacy records without storage, arithmetic, runtime, or AI behavior."
owner = "crate/sim-study-core"
audiences = ["code", "framework"]
guidance = "Reuse these opaque subject revisions and canonical records whenever a domain needs study identity or evidence exchange. Keep operational paths, clocks, retry policy, placement, secrets, storage, arithmetic, and domain-specific verdict policy outside this crate."
claims_anchors = [
  "anchor/crate/sim-study-core",
]
claims_specimens = [
  "spec-test/sim-foundation/crates/sim-study-core/tests/study_contract",
]

[[feature]]
id = "feature/sim-foundation/index-vault-projection"
title = "Exact Index vault projection"
summary = "Project every canonical Index row into a deterministic syntax-free note plan and prove exact primary and derived claim coverage."
owner = "crate/sim-index-vault-core"
audiences = ["code", "framework"]
guidance = "Reuse this projection before rendering any complete public SIM Index as a vault. Keep canonical records as IndexRow values, add derived navigation only with an explicit origin, and require the exact claim certificate to close."
claims_anchors = [
  "anchor/crate/sim-index-vault-core",
]
claims_specimens = [
  "spec-test/sim-foundation/crates/sim-index-vault-core/tests/projection",
]

[[feature]]
id = "feature/sim-foundation/value-helpers"
title = "Value helper framework"
summary = "Provide shared value conversion, expression builder, expression field reader, map field reader, and field access helpers for reusable runtime libraries."
owner = "crate/sim-value"
audiences = ["code", "framework"]
guidance = "Use this row when decoding or projecting runtime values, reusing expression field readers, reading fields from maps, or building reusable expression helper code inside a framework crate."
claims_anchors = [
  "anchor/crate/sim-value",
]
claims_specimens = [
  "spec-test/sim-foundation/crates/sim-value/src/tests",
]

[[feature]]
id = "feature/sim-foundation/exact-code-unit-text"
title = "Exact code-unit text"
summary = "Preserve UTF-16 code units through runtime values, tagged expressions, read construction, Shape matching, and browse without conflating them with scalar Unicode text."
owner = "crate/sim-text"
audiences = ["code", "framework"]
guidance = "Reuse this row for JavaScript/JVM strings or binary formats that may contain lone surrogates. Use the checked scalar projection for text-only codecs so invalid input is refused at its code-unit offset. The runtime text-ownership policy rejects public raw Vec<u16> string records and from_utf16_lossy crossings; numeric buffers and codec-local work arrays require an explicit declared context."
claims_anchors = [
  "anchor/crate/sim-text",
]
claims_specimens = [
  "spec-test/sim-foundation/crates/sim-text/tests/neutral_utf16_conformance",
]

[[feature]]
id = "feature/sim-foundation/table-dir-core"
title = "Table and Dir core"
summary = "Define shared table and directory contracts used by storage, index, and host-facing libraries."
owner = "crate/sim-table-core"
audiences = ["code", "framework"]
guidance = "Use this row when implementing get, set, keys, entries, delete, or directory behavior."
claims_anchors = [
  "anchor/crate/sim-config",
  "anchor/crate/sim-table-core",
]
claims_specimens = [
  "spec-test/sim-foundation/crates/sim-table-core/tests/path_references",
]

[[feature]]
id = "feature/sim-foundation/table-path-references"
title = "Table path references"
summary = "Parse, normalize, resolve, and format bounded absolute and relative Table/Dir path references."
owner = "crate/sim-table-core"
audiences = ["code", "framework"]
guidance = "Use this row when a library accepts textual Table/Dir locations, needs escaped segment formatting, or resolves relative references against a canonical TablePath."
claims_anchors = [
  "anchor/rustdoc/sim-table-core/table-path",
  "anchor/rustdoc/sim-table-core/table-path-ref",
  "anchor/rustdoc/sim-table-core/table-path-ref-error",
  "anchor/rustdoc/sim-table-core/table-path-ref-part",
]
claims_specimens = [
  "spec-test/sim-foundation/crates/sim-table-core/src/tests",
]

[[feature]]
id = "feature/sim-foundation/relation-core"
title = "Open relational domain core"
summary = "Define provider-neutral logical domains, typed cells and rows, exact storage representations, and canonical Datum-backed relational identity."
owner = "crate/sim-relation-core"
audiences = ["code", "framework"]
guidance = "Reuse these records for relational schemas and provider boundaries. Extend the catalog with symbolic DomainSpec records; do not introduce a closed SQL value enum or a second digest implementation. Runtime Shape resolution belongs in sim-relation-shape."
claims_anchors = [
  "anchor/crate/sim-relation-core",
]
claims_specimens = [
  "spec-test/sim-foundation/crates/sim-relation-core/tests/domain_and_rows",
]

[[feature]]
id = "feature/sim-foundation/relation-schema"
title = "Validated relational schemas"
summary = "Define canonical provider-neutral schema intent and distinct normalized physical catalog evidence with fail-closed graph validation."
owner = "crate/sim-relation-schema"
audiences = ["code", "framework"]
guidance = "Use Schema for portable relational intent and PhysicalSchema only for normalized live-provider observations. Reuse sim-relation-core domain ids and identities; inject domain Shape validation for defaults and generated expressions."
claims_anchors = [
  "anchor/crate/sim-relation-schema",
]
claims_specimens = [
  "spec-test/sim-foundation/crates/sim-relation-schema/tests/schema_contract",
]
supports = [
  "feature/sim-foundation/relation-core",
]

[[feature]]
id = "feature/sim-foundation/relation-plan"
title = "Admitted logical relation plans"
summary = "Define complete scoped query and mutation algebra and admit it into opaque, canonically identified provider requests."
owner = "crate/sim-relation-plan"
audiences = ["code", "framework"]
guidance = "Build Rel, Scalar, Aggregate, and Mutation records in product libraries, then use admission as the sole path to CheckedQuery or CheckedMutation. Providers consume checked plans and must not accept SQL text or unchecked records."
claims_anchors = [
  "anchor/crate/sim-relation-plan",
]
claims_specimens = [
  "spec-test/sim-foundation/crates/sim-relation-plan/tests/admission",
]
supports = [
  "feature/sim-foundation/relation-core",
  "feature/sim-foundation/relation-schema",
]

[[feature]]
id = "feature/sim-foundation/relation-migrate"
title = "Checked relational migrations"
summary = "Admit linear, identity-checked schema evolution programs and verify provider state with exact attestations."
owner = "crate/sim-relation-migrate"
audiences = ["code", "framework"]
guidance = "Use authored migration operations for destructive or ambiguous changes. Automatic derivation is intentionally limited to lossless table creation and nullable column addition; providers must offer transactional DDL and post-apply introspection."
claims_anchors = [
  "anchor/crate/sim-relation-migrate",
]
claims_specimens = [
  "spec-test/sim-foundation/crates/sim-relation-migrate/tests/migration",
]
supports = [
  "feature/sim-foundation/relation-core",
  "feature/sim-foundation/relation-schema",
  "feature/sim-foundation/relation-plan",
]

[[feature]]
id = "feature/sim-foundation/index-graph-core"
title = "Index graph core"
summary = "Define canonical SIM Index records, ids, edges, checks, and card projections for tooling and codecs."
owner = "crate/sim-index-core"
audiences = ["code"]
guidance = "Use this row when a caller needs to build, validate, or project the SIM Index graph. Projection authors must traverse IndexDoc::inventory() instead of directly enumerating top-level fields; use normalized_inventory() only when structural identity order, rather than source order, is required."
claims_anchors = [
  "anchor/crate/sim-index-core",
]

[[feature]]
id = "feature/sim-foundation/blocking-http-client"
title = "Policy-complete blocking HTTP client"
summary = "Provide one bounded, streaming, cancellation-aware blocking HTTP boundary over injected capsule connectors."
owner = "crate/sim-lib-net-http"
audiences = ["code", "framework"]
guidance = "Reuse this client for generic blocking HTTP. Keep protocol parsing in sim-lib-net-core, inject capsule DNS/socket realization through Connector, mark credentials sensitive, and expand redirects, proxies, roots, or ambient authority only through explicit Policy fields."
claims_anchors = [
  "anchor/crate/sim-lib-net-http",
]
claims_specimens = [
  "recipe/sim-foundation/crates/sim-lib-net-http/01-basics/bounded-get",
]
supports = [
  "feature/sim-foundation/host-primitives",
]

[[feature]]
id = "feature/sim-foundation/host-primitives"
title = "Host primitive foundation"
summary = "Define neutral host-port cards, open identities, shared platform-time values and bindings, mechanical refusals and budgets, and lexical object binding separately from concrete host realization."
owner = "crate/sim-host-core"
audiences = ["code", "framework"]
guidance = "Use sim-host-core for domain-defined neutral port contracts, child-Env binding, and the shared WallClock, MonotonicClock, Timer, timestamp, and deterministic model contracts. Keep operating-system calls, provider realization, evidence grading, and product policy in platform or domain libraries."
claims_anchors = [
  "anchor/crate/sim-host-core",
  "anchor/crate/sim-lib-net-core",
  "anchor/crate/sim-lib-surface-card",
]
claims_specimens = [
  "recipe/sim-foundation/crates/sim-lib-net-core/01-basics/response-head",
]

[[feature]]
id = "feature/sim-foundation/cancellation"
title = "Executor-neutral cancellation"
summary = "Bound request and provider lifetimes with one idempotent terminal transition, bounded reason, child propagation, and race-safe waiter removal."
owner = "crate/sim-cancel"
audiences = ["code", "framework"]
guidance = "Construct Cancellation at a host or binding boundary and pass it explicitly into owned work. Derive children for nested lifetimes. Await the executor-neutral future or observe the reason; never add a global token registry or retain application callbacks in cancellation state."
claims_anchors = [
  "anchor/crate/sim-cancel",
]
claims_specimens = [
  "recipe/sim-foundation/crates/sim-cancel/01-basics/request-lifetime",
]
supports = [
  "feature/sim-foundation/host-primitives",
]

[[feature]]
id = "feature/sim-foundation/protected-state"
title = "Capability-injected protected state"
summary = "Protect bounded opaque caller bytes under exact state bindings, injected retained keys, secure nonces, and platform time, with optional atomic single-use claims."
owner = "crate/sim-lib-protected-state"
audiences = ["code", "framework"]
guidance = "Reuse this crate for opaque continuation or handoff state. Callers own typed serialization and canonical context digests; hosts inject keys, a reviewed CryptoRng, and WallClock. AEAD is not replay prevention: use TableConsumptionLedger when single-use behavior is required."
claims_anchors = [
  "anchor/crate/sim-lib-protected-state",
]
claims_specimens = [
  "recipe/sim-foundation/crates/sim-lib-protected-state/01-basics/exact-binding",
]
supports = [
  "feature/sim-foundation/host-primitives",
  "feature/sim-foundation/table-dir-core",
]

[[feature]]
id = "feature/sim-foundation/cookbook"
title = "Cookbook recipe framework"
summary = "Describe reusable recipe metadata and generated cookbook records consumed by public docs and tooling."
owner = "crate/sim-cookbook"
audiences = ["code", "framework"]
guidance = "Use this row when a crate needs recipe metadata to appear in generated docs."
claims_anchors = [
  "anchor/crate/sim-cookbook",
  "anchor/export/sim-cookbook/codec/lisp",
  "anchor/export/sim-cookbook/model/defaults",
]
claims_specimens = [
  "spec-test/sim-foundation/crates/sim-cookbook/src/model",
]

[[feature]]
id = "feature/sim-foundation/cookbook-build-tool"
title = "Cookbook build host tool"
summary = "Validate recipe packages and deterministically emit include-bytes source during Rust builds."
owner = "crate/sim-cookbook-build"
audiences = ["code", "framework"]
guidance = "Use sim-cookbook-build only from build scripts. Product code consumes supplied embedded bytes through sim-cookbook; it must not depend on this filesystem-and-environment host tool. The foundation xtask is likewise a repository host tool, not a product dependency."
claims_anchors = [
  "anchor/crate/sim-cookbook-build",
]
supports = [
  "feature/sim-foundation/cookbook",
]

[[feature]]
id = "feature/sim-foundation/library-macros"
title = "Library macro surface"
summary = "Generate checked Rust declarations for authored SIM libraries and codec markers."
owner = "crate/sim-macros"
audiences = ["code"]
guidance = "Use this row when adding a Rust macro surface for library manifests, exports, or marker metadata."
claims_anchors = [
  "anchor/crate/sim-macros",
]

[[feature]]
id = "feature/sim-foundation/contract-emitter"
title = "Foundation contract emitter"
summary = "Emit generated repository contract and index fragments for foundation crates."
owner = "crate/xtask"
audiences = ["code"]
guidance = "Use this row when refreshing generated contract evidence for foundation crates."
claims_anchors = [
  "anchor/crate/xtask",
]
supports = [
  "feature/sim-foundation/index-graph-core",
]

[[route]]
id = "route/add-value-helper"
task = "Add or reuse a value helper, expression field reader, or map field access helper"
audiences = ["code", "framework"]
steps = [
  { feature = "feature/sim-foundation/value-helpers", why = "The value row owns shared runtime value conversion, expression builder, expression field reader, map field reader, and field access helpers." },
]

[[route]]
id = "route/use-exact-utf16-text"
task = "Preserve, inspect, encode, or round-trip exact UTF-16 code units"
audiences = ["code", "framework"]
steps = [
  { feature = "feature/sim-foundation/exact-code-unit-text", why = "The neutral sim-text owner preserves paired and lone surrogate code units without depending on a guest-language string or pattern type." },
]

[[route]]
id = "route/build-evidence-bearing-web-search"
task = "Build provider-neutral web search with exact citation evidence"
audiences = ["code", "framework"]
steps = [
  { feature = "feature/sim-foundation/web-evidence-core", why = "The web row owns raw and normalized identities, exact selectors, and complete typed policy receipts." },
  { feature = "feature/sim-foundation/search-evidence-core", why = "The search row keeps provider claims distinct from observations and checked citations while exposing a pure wire boundary." },
  { specimen = "recipe/sim-foundation/crates/sim-lib-search-core/01-basics/checked-citation", why = "The network-free checked specimen terminates at a provider claim beside an exact representation-bound citation." },
]

[[route]]
id = "route/add-table-dir-core"
task = "Add a Table or Dir core contract"
audiences = ["code", "framework"]
steps = [
  { feature = "feature/sim-foundation/table-dir-core", why = "The table core row owns shared Table and Dir contracts." },
  { feature = "feature/sim-foundation/table-path-references", why = "The path reference row owns escaped absolute and relative Table/Dir path parsing, normalization, and resolution." },
]

[[route]]
id = "route/add-index-graph-record"
task = "Add an index graph record"
audiences = ["code"]
steps = [
  { feature = "feature/sim-foundation/index-graph-core", why = "The index core row owns graph ids, records, edges, and validation." },
]

[[route]]
id = "route/add-host-primitive"
task = "Add a host primitive"
audiences = ["code", "framework"]
steps = [
  { feature = "feature/sim-foundation/host-primitives", why = "Neutral port cards, open identities, runtime-mechanics refusals, budgets, and lexical bindings belong in sim-host-core; concrete host realization belongs in platform and domain libraries." },
]

[[route]]
id = "route/compose-platform-time"
task = "Compose wall time, monotonic time, timers, and cancellation into a request lifetime"
audiences = ["code", "framework"]
steps = [
  { feature = "feature/sim-foundation/host-primitives", why = "The existing platform-time contracts own wall and monotonic values, timer behavior, explicit bindings, and the deterministic model." },
  { feature = "feature/sim-foundation/cancellation", why = "Cancellation composes with a supplied deadline without choosing an executor, timer implementation, or transport." },
  { specimen = "recipe/sim-foundation/crates/sim-cancel/01-basics/request-lifetime", why = "The checked recipe demonstrates explicit host-to-request ownership; the crate race suite proves registration, propagation, timeout conversion, completion, and dropped-waiter behavior." },
]

[[route]]
id = "route/use-blocking-http"
task = "Issue a bounded blocking HTTP request from a capsule-backed adapter"
audiences = ["code", "framework"]
steps = [
  { feature = "feature/sim-foundation/host-primitives", why = "The capsule supplies DNS, socket, clock, cancellation, and trust realization without ambient host access." },
  { feature = "feature/sim-foundation/blocking-http-client", why = "The shared HTTP boundary owns framing, resource caps, sensitive headers, deadlines, cancellation, and authority policy." },
]

[[route]]
id = "route/protect-opaque-state"
task = "Protect opaque continuation or handoff state with rotation and optional single-use consumption"
audiences = ["code", "framework"]
steps = [
  { feature = "feature/sim-foundation/host-primitives", why = "The shared WallClock contract supplies the explicit expiry observation without ambient host time." },
  { feature = "feature/sim-foundation/protected-state", why = "The protected-state owner supplies the bounded envelope, collision-free binding, injected key and nonce capabilities, rotation behavior, uniform rejection, and canonical Table consumption adapter." },
  { specimen = "recipe/sim-foundation/crates/sim-lib-protected-state/01-basics/exact-binding", why = "The checked recipe keeps caller serialization, key custody, clock ownership, and optional replay claims explicit." },
]

[[route]]
id = "route/add-cookbook-recipe"
task = "Add a cookbook recipe"
audiences = ["code", "framework"]
steps = [
  { feature = "feature/sim-foundation/cookbook", why = "The cookbook row owns reusable recipe metadata." },
]

[[route]]
id = "route/add-library-macro"
task = "Add a library macro"
audiences = ["code"]
steps = [
  { feature = "feature/sim-foundation/library-macros", why = "The macro row owns checked Rust declarations for SIM libraries." },
  { feature = "feature/sim-foundation/contract-emitter", why = "The emitter row keeps generated contract evidence current." },
]

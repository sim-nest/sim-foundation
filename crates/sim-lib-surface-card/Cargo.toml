[package]
name = "sim-lib-surface-card"
version = "0.1.4"
edition = "2024"
license = "MPL-2.0"
description = "Shared, plain-data surface-card spine."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-foundation"
homepage = "https://github.com/sim-nest/sim-foundation"

[package.metadata.sim-recipes]
policy = "descriptor"
reason = "The cookbook entries document descriptor shapes for projection and are marked sandbox-descriptor."

[dependencies]
sim-cookbook = { version = "0.2.1", path = "../sim-cookbook" }
sim-kernel = { version = "0.2.0" }

[build-dependencies]
sim-cookbook = { version = "0.2.1", path = "../sim-cookbook" }

[lints]
workspace = true

[package]
name = "sim-index-core"
version = "0.2.0"
edition = "2024"
license = "MPL-2.0"
description = "Core records, keys, checks, and card projections for the SIM Index graph."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-foundation"
homepage = "https://github.com/sim-nest/sim-foundation"

[package.metadata.sim-recipes]

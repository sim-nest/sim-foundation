[package]
name = "sim-config"
version = "0.3.0"
edition = "2024"
license = "MPL-2.0"
description = "Table and Dir substrate for layered SIM configuration."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-foundation"
homepage = "https://github.com/sim-nest/sim-foundation"

[package.metadata.sim-recipes]
policy = "rustdoc"
reason = "This configuration substrate is taught through rustdoc examples and unit tests; no recipe directory is shipped."

[dependencies]
sim-kernel = { version = "0.4.0" }
sim-table-core = { version = "0.3.0", path = "../sim-table-core" }
sim-value = { version = "0.4.0", path = "../sim-value" }

[lints]
workspace = true

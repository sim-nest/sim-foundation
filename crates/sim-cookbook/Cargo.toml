[package]
name = "sim-cookbook"
version = "0.3.0"
edition = "2024"
license = "MPL-2.0"
description = "Cookbook engine for SIM's crate-local tutorial recipes."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-foundation"
homepage = "https://github.com/sim-nest/sim-foundation"

[package.metadata.sim-recipes]
policy = "engine"
reason = "This crate implements the recipe engine and documents itself through rustdoc examples instead of a recipe directory."

[dependencies]
sim-config = { version = "0.2.0", path = "../sim-config" }
sim-kernel = { version = "0.3.0" }
sim-value = { version = "0.3.0", path = "../sim-value" }

[lints]
workspace = true

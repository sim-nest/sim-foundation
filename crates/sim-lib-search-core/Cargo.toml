[package]
name = "sim-lib-search-core"
version = "0.2.0"
edition = "2024"
license = "MPL-2.0"
description = "Pure open search, observation, ranking-evidence, and research bundle records for SIM."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-foundation"
homepage = "https://github.com/sim-nest/sim-foundation"

[package.metadata.sim-recipes]
policy = "descriptor"
reason = "The network-free research bundle is a sandbox descriptor backed by conformance tests."

[dependencies]
sim-kernel = { version = "0.4.0" }
sim-lib-net-core = { version = "0.4.0", path = "../sim-lib-net-core" }
sim-lib-web-core = { version = "0.2.0", path = "../sim-lib-web-core" }
sim-cookbook = { version = "0.4.0", path = "../sim-cookbook" }

[build-dependencies]
sim-cookbook-build = { version = "0.2.0", path = "../sim-cookbook-build" }

[lints]
workspace = true

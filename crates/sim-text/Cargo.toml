[package]
name = "sim-text"
version = "0.3.0"
edition = "2024"
license = "MPL-2.0"
description = "Neutral exact text values and explicit Unicode projections for SIM."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-foundation"

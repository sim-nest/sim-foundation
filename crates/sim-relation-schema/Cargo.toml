[package]
name = "sim-relation-schema"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Validated logical and normalized physical relational schemas for SIM."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-foundation"
homepage = "https://github.com/sim-nest/sim-foundation"

[package.metadata.sim-recipes]
policy = "rustdoc"
reason = "Exact store-schema fixtures are checked by rustdoc and integration tests."

[dependencies]
sim-kernel = { version = "0.2.1" }
sim-relation-core = { version = "0.1.0", path = "../sim-relation-core" }

[lints]
workspace = true


[workspace]
resolver = "3"
members = [
  "crates/sim-config",
  "crates/sim-cookbook",
  "crates/sim-cookbook-build",
  "crates/sim-index-core",
  "crates/sim-host-core",
  "crates/sim-cancel",
  "crates/sim-lib-net-core",
  "crates/sim-lib-net-http",
  "crates/sim-lib-protected-state",
  "crates/sim-lib-surface-card",
  "crates/sim-relation-core",
  "crates/sim-relation-plan",
  "crates/sim-relation-schema",
  "crates/sim-macros",
  "crates/sim-table-core",
  "crates/sim-text",
  "crates/sim-value",
  "xtask",
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/sim-nest/sim-foundation"
homepage = "https://github.com/sim-nest/sim-foundation"

[workspace.lints.rust]
unsafe_code = "forbid"
